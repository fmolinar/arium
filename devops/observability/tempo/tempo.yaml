# Tempo as a single process with its data on the tempo_data volume. The API
# sends spans over OTLP/HTTP to tempo:4318 (OTEL_EXPORTER_OTLP_ENDPOINT in
# compose.yaml).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    # Spans carry the client IP and user agent, like the request logs, so
    # they're kept for the same 14 days (see the Privacy Policy).
    block_retention: 336h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
