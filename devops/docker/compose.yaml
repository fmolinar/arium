# Docker Compose configuration for the Arium application
networks:
  arium_network:
    driver: bridge
services:
  app:
    networks:
      - arium_network
    build:
      # Build context and Dockerfile path
      context: ../..
      # point to the Dockerfile in the devops/docker directory
      dockerfile: devops/docker/Dockerfile
    # pull the latest image from the Docker registry if it exists
    image: arium-react:latest
    container_name: arium-react
    restart: unless-stopped
    # Set port mapping for the application, mapping port 3000 on the host to port 4173 in the container
    ports:
      - "3000:4173"
    # vite preview proxies /api to the backend (see arium/vite.config.js).
    environment:
      - API_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend

  backend:
    networks:
      - arium_network
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile.backend
    image: arium-backend:latest
    container_name: arium-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      - ADDRESS=:8080
      - FRONTEND_URL=http://localhost:3000
      - MONGO_URI=mongodb://mongo:27017/arium
      - MONGO_DB=arium
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (see devops/docker/.env.example)}

  # News collector. Runs on a schedule (3 times a day by default), keeps 30 days
  # of data in the collector_data volume, skips duplicate articles and syncs
  # them into Mongo's news collection.
  # Collect once right now, alongside the scheduler:
  #   docker compose run --rm collector -once
  collector:
    networks:
      - arium_network
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile.collector
    image: arium-collector:latest
    container_name: arium-collector
    restart: unless-stopped
    depends_on:
      - mongo
    volumes:
      - collector_data:/data
    environment:
      - COLLECTOR_OUT_DIR=/data
      # After each run, sync the stored articles into Mongo for GET /api/v1/news.
      - MONGO_URI=mongodb://mongo:27017/arium
      - MONGO_DB=arium
      - COLLECTOR_SCHEDULE=${COLLECTOR_SCHEDULE:-00:00,08:00,16:00}
      - COLLECTOR_TIMEZONE=${COLLECTOR_TIMEZONE:-UTC}
      - COLLECTOR_RETENTION=${COLLECTOR_RETENTION:-720h}
      - COLLECTOR_SINCE=${COLLECTOR_SINCE:-168h}
      - COLLECTOR_SOURCE_TIMEOUT=${COLLECTOR_SOURCE_TIMEOUT:-15s}
    # Unhealthy when a scheduled run is over 10 minutes late: the scheduler
    # loop died or a run is hung.
    healthcheck:
      test: ["CMD", "./collector", "-healthcheck"]
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3

  mongo:
    networks:
      - arium_network
    image: mongo:latest
    container_name: arium-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=arium

volumes:
  mongo_data:
  collector_data:
