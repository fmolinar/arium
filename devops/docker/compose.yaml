# Docker Compose configuration for the Arium application

# Cap container logs, which include the API's request logs (IP address, user
# agent): Docker rotates each container's log at 10 MB and keeps 3 files, so
# older entries are overwritten. The Privacy Policy (arium/src/pages/Privacy.jsx)
# relies on this.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  arium_network:
    driver: bridge
  # Only docker-socket-proxy and alloy, with no route out.
  docker_api:
    driver: bridge
    internal: true
services:
  app:
    logging: *default-logging
    networks:
      - arium_network
    build:
      # Build context and Dockerfile path
      context: ../..
      # point to the Dockerfile in the devops/docker directory
      dockerfile: devops/docker/Dockerfile
    # pull the latest image from the Docker registry if it exists
    image: arium-react:latest
    container_name: arium-react
    restart: unless-stopped
    # Set port mapping for the application, mapping port 3000 on the host to port 4173 in the container
    ports:
      - "3000:4173"
    # vite preview proxies /api to the backend (see arium/vite.config.js).
    environment:
      - API_PROXY_TARGET=http://backend:8080
      # Public hostname(s) vite preview should answer, e.g. the domain the
      # cloudflared service forwards here. Empty: localhost only.
      - ALLOWED_HOSTS=${PUBLIC_HOSTNAME:-}
    depends_on:
      - backend

  backend:
    logging: *default-logging
    networks:
      - arium_network
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile.backend
    image: arium-backend:latest
    container_name: arium-backend
    restart: unless-stopped
    # Localhost only: the app reaches the API over the compose network, and
    # the internet through the app's /api proxy, behind Cloudflare.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mongo
    environment:
      - ADDRESS=:8080
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Where the API (and so the frontend) reads news and users from. Set
      # MONGO_URI to the Atlas connection string to serve what the Lambda
      # collector (devops/terraform) writes; unset, it's the local mongo service.
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/arium}
      - MONGO_DB=${MONGO_DB:-arium}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (see devops/docker/.env.example)}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Prometheus metrics at /metrics, reachable only on the compose network.
      - METRICS_ADDRESS=:9464
      # Spans for every request and MongoDB command go to Tempo over OTLP/HTTP.
      # Empty disables tracing.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://tempo:4318}

  # News collector. Runs on a schedule (3 times a day by default), keeps 30 days
  # of data in the collector_data volume, skips duplicate articles and syncs
  # them into Mongo's news collection.
  # Collect once right now, alongside the scheduler:
  #   docker compose run --rm collector -once
  collector:
    logging: *default-logging
    networks:
      - arium_network
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile.collector
    image: arium-collector:latest
    container_name: arium-collector
    restart: unless-stopped
    depends_on:
      - mongo
    volumes:
      - collector_data:/data
    environment:
      - COLLECTOR_OUT_DIR=/data
      # After each run, sync the stored articles into Mongo for GET /api/v1/news.
      # Always the local mongo service, even when the backend uses Atlas: this
      # sync re-imports and overwrites articles, while the Lambda collector
      # writes to Atlas insert-only, and the two shouldn't share a collection.
      - MONGO_URI=mongodb://mongo:27017/arium
      - MONGO_DB=arium
      - COLLECTOR_SCHEDULE=${COLLECTOR_SCHEDULE:-00:00,08:00,16:00}
      - COLLECTOR_TIMEZONE=${COLLECTOR_TIMEZONE:-UTC}
      # Collect once when the container starts, so a fresh stack isn't empty
      # until the next scheduled time.
      - COLLECTOR_RUN_ON_START=${COLLECTOR_RUN_ON_START:-true}
      - COLLECTOR_RETENTION=${COLLECTOR_RETENTION:-720h}
      - COLLECTOR_SINCE=${COLLECTOR_SINCE:-168h}
      - COLLECTOR_SOURCE_TIMEOUT=${COLLECTOR_SOURCE_TIMEOUT:-15s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Prometheus metrics at /metrics, reachable only on the compose network.
      - COLLECTOR_METRICS_ADDRESS=:9464
    # Unhealthy when a scheduled run is over 10 minutes late: the scheduler
    # loop died or a run is hung.
    healthcheck:
      test: ["CMD", "./collector", "-healthcheck"]
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3

  # Cloudflare Tunnel: serves the app on your domain from this machine, with no
  # open ports or public IP. Only runs with the "tunnel" profile (set
  # COMPOSE_PROFILES=tunnel in .env). The tunnel and its public hostname
  # (pointing at http://app:4173) are managed in the Cloudflare dashboard.
  # Give it a tunnel of its own: connectors sharing a token are replicas, so
  # this one would also get another project's traffic and fail it. If the
  # machine already runs a tunnel, route the hostname there to port 3000.
  cloudflared:
    logging: *default-logging
    networks:
      - arium_network
    image: cloudflare/cloudflared:2026.9.3
    container_name: arium-cloudflared
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

  mongo:
    networks:
      - arium_network
    image: mongo:latest
    container_name: arium-mongo
    restart: unless-stopped
    # Localhost only: this mongo has no authentication.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=arium

  # Scrapes the backend and collector /metrics endpoints (see
  # devops/observability/prometheus/prometheus.yml). Bound to localhost only.
  prometheus:
    networks:
      - arium_network
    image: prom/prometheus:v3.15.0
    container_name: arium-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30 days: the SLOs in ../observability/prometheus/rules are measured
      # over 30 days.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - collector
      - alertmanager

  # Receives the alerts from Prometheus's rules. No receiver integrations are
  # configured yet (see ../observability/alertmanager/alertmanager.yml).
  alertmanager:
    networks:
      - arium_network
    image: prom/alertmanager:v0.34.2
    container_name: arium-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  # Log storage, fed by alloy. Keeps 14 days (the Privacy Policy relies on it).
  loki:
    networks:
      - arium_network
    image: grafana/loki:3.7.9
    container_name: arium-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  # Tempo runs as UID 10001 but its data directory isn't in the image, so a
  # fresh tempo_data volume is owned by root. This hands it over first.
  tempo-init:
    image: &tempo-image grafana/tempo:2.10.10
    container_name: arium-tempo-init
    network_mode: none
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo_data:/var/tempo

  # Trace storage. The backend sends spans to tempo:4318. Keeps 14 days.
  tempo:
    networks:
      - arium_network
    image: *tempo-image
    container_name: arium-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  # Read-only gate to the Docker API for alloy: listing containers and reading
  # their logs, nothing else (every other endpoint and all POSTs are refused).
  docker-socket-proxy:
    networks:
      - docker_api
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: arium-docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Ships the arium-* containers' logs to Loki
  # (../observability/alloy/config.alloy).
  alloy:
    networks:
      - arium_network
      - docker_api
    image: grafana/alloy:v1.21.1
    container_name: arium-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read positions, so a restart doesn't resend logs.
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - docker-socket-proxy
      - loki

  # Dashboards and the Prometheus, Loki, Tempo and Alertmanager datasources are
  # provisioned from devops/observability/grafana. Open http://localhost:3001 (admin / the
  # GRAFANA_ADMIN_PASSWORD from .env, default "admin").
  grafana:
    networks:
      - arium_network
    image: grafana/grafana:13.2.3
    container_name: arium-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/api.json
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager

volumes:
  mongo_data:
  collector_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  alloy_data:
