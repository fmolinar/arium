name: Deploy to local Docker Desktop

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: local-docker-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: ./backend
    timeout-minutes: 10

    steps:
      - name: Check out merged code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Start MongoDB
        run: |
          docker rm -f arium-ci-mongo 2>/dev/null || true
          docker run -d --rm --name arium-ci-mongo -p 27018:27017 mongo:latest

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: go test -tags=integration ./tests/integration/...
        env:
          TEST_MONGO_URI: mongodb://localhost:27018

      - name: Stop MongoDB
        if: always()
        run: docker rm -f arium-ci-mongo 2>/dev/null || true

  deploy:
    needs: test
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: ./devops/docker
    timeout-minutes: 15
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Check out merged code
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Build images
        # --profile collector also rebuilds the on-demand collector image; `up`
        # below doesn't enable the profile, so the collector isn't started.
        run: docker compose --profile collector build

      - name: Deploy container
        run: docker compose up -d --remove-orphans

      - name: Display deployment status
        run: |
          docker compose ps
          docker compose logs --tail=50 app

      - name: Remove unused images
        run: docker image prune -f