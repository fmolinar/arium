name: Deploy to local Docker Desktop

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: local-docker-production
  cancel-in-progress: true

jobs:
  test:
    # Same machine as deploy: the Mac that serves the site.
    runs-on: [self-hosted, mac-server]
    defaults:
      run:
        working-directory: ./backend
    timeout-minutes: 10

    steps:
      - name: Check out merged code
        uses: actions/checkout@v4

      - name: Use a Docker config without the Keychain helper
        run: ${{ github.workspace }}/.github/scripts/docker-config-no-keychain.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Start MongoDB
        run: |
          docker rm -f arium-ci-mongo 2>/dev/null || true
          docker run -d --rm --name arium-ci-mongo -p 27018:27017 mongo:latest

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: go test -tags=integration ./tests/integration/...
        env:
          TEST_MONGO_URI: mongodb://localhost:27018

      - name: Stop MongoDB
        if: always()
        run: docker rm -f arium-ci-mongo 2>/dev/null || true

  deploy:
    needs: test
    # The Mac that serves the site through the Cloudflare Tunnel.
    runs-on: [self-hosted, mac-server]
    defaults:
      run:
        working-directory: ./devops/docker
    timeout-minutes: 15
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # Atlas connection string for the backend. Empty (secret unset) falls
      # back to the local mongo service.
      MONGO_URI: ${{ secrets.MONGO_URI }}
      # Public domain through the cloudflared service (see devops/docker/.env.example).
      COMPOSE_PROFILES: tunnel
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
      FRONTEND_URL: https://${{ vars.PUBLIC_HOSTNAME }}

    steps:
      - name: Check out merged code
        uses: actions/checkout@v4

      - name: Use a Docker config without the Keychain helper
        run: ${{ github.workspace }}/.github/scripts/docker-config-no-keychain.sh

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Build images
        run: docker compose build

      - name: Check Prometheus config
        run: docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml

      - name: Deploy container
        run: docker compose up -d --remove-orphans

      # prometheus.yml is bind-mounted, so compose doesn't recreate Prometheus
      # when only that file changed. SIGHUP makes it reload the file.
      - name: Reload Prometheus config
        run: docker compose kill -s SIGHUP prometheus

      - name: Display deployment status
        run: |
          docker compose ps
          docker compose logs --tail=50 app collector prometheus grafana cloudflared

      - name: Remove unused images
        run: docker image prune -f